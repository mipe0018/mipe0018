<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="460"
     viewBox="0 0 760 460">

  <!-- BACKGROUND -->
  <rect width="760" height="460" rx="24" fill="#0d1117"/>

  <rect x="1" y="1"
        width="758"
        height="458"
        rx="23"
        fill="none"
        stroke="#30363d"/>


  <!-- HEADER -->

  <text x="380" y="43"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold">
    Double Diamond
  </text>

  <text x="380" y="67"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="13">
    A human-centred approach to design
  </text>


  <!-- PROCESS LABELS -->

  <text x="190" y="108"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold"
        letter-spacing="1">
    EXPLORE
  </text>

  <text x="570" y="108"
        text-anchor="middle"
        fill="#f78166"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold"
        letter-spacing="1">
    CREATE
  </text>


  <!-- FIRST DIAMOND -->

  <!-- Full diamond -->
  <polygon
    points="45,190 190,125 335,190 190,255"
    fill="#161b22"
    stroke="#30363d"
    stroke-width="2"/>

  <!-- Discover side -->
  <polygon
    points="45,190 190,125 190,255"
    fill="#58a6ff"
    opacity="0.12"/>

  <!-- Define side -->
  <polygon
    points="190,125 335,190 190,255"
    fill="#a371f7"
    opacity="0.12"/>

  <!-- Center -->
  <line x1="190" y1="125"
        x2="190" y2="255"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- DISCOVER -->

  <circle cx="125" cy="190"
          r="27"
          fill="#0d1117"
          stroke="#58a6ff"
          stroke-width="2"/>

  <text x="125" y="194"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    01
  </text>

  <text x="125" y="287"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Discover
  </text>

  <text x="125" y="305"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Research · Users · Insights
  </text>


  <!-- DEFINE -->

  <circle cx="255" cy="190"
          r="27"
          fill="#0d1117"
          stroke="#a371f7"
          stroke-width="2"/>

  <text x="255" y="194"
        text-anchor="middle"
        fill="#a371f7"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    02
  </text>

  <text x="255" y="287"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Define
  </text>

  <text x="255" y="305"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Problem · Goals · Direction
  </text>


  <!-- ARROW -->

  <line x1="335" y1="190"
        x2="425" y2="190"
        stroke="#484f58"
        stroke-width="2"/>

  <polygon
    points="425,190 414,184 414,196"
    fill="#484f58"/>


  <!-- SECOND DIAMOND -->

  <polygon
    points="425,190 570,125 715,190 570,255"
    fill="#161b22"
    stroke="#30363d"
    stroke-width="2"/>

  <!-- Develop side -->
  <polygon
    points="425,190 570,125 570,255"
    fill="#f78166"
    opacity="0.12"/>

  <!-- Deliver side -->
  <polygon
    points="570,125 715,190 570,255"
    fill="#3fb950"
    opacity="0.12"/>

  <!-- Center -->
  <line x1="570" y1="125"
        x2="570" y2="255"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- DEVELOP -->

  <circle cx="505" cy="190"
          r="27"
          fill="#0d1117"
          stroke="#f78166"
          stroke-width="2"/>

  <text x="505" y="194"
        text-anchor="middle"
        fill="#f78166"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    03
  </text>

  <text x="505" y="287"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Develop
  </text>

  <text x="505" y="305"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Ideas · Prototype · Test
  </text>


  <!-- DELIVER -->

  <circle cx="635" cy="190"
          r="27"
          fill="#0d1117"
          stroke="#3fb950"
          stroke-width="2"/>

  <text x="635" y="194"
        text-anchor="middle"
        fill="#3fb950"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    04
  </text>

  <text x="635" y="287"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Deliver
  </text>

  <text x="635" y="305"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Solution · Feedback · Launch
  </text>


  <!-- DIVIDER -->

  <line x1="80" y1="345"
        x2="680" y2="345"
        stroke="#21262d"
        stroke-width="1"/>


  <!-- DIVERGE / CONVERGE -->

  <text x="190" y="372"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    DIVERGE
  </text>

  <text x="190" y="391"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Explore possibilities
  </text>


  <text x="570" y="372"
        text-anchor="middle"
        fill="#3fb950"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    CONVERGE
  </text>

  <text x="570" y="391"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Choose what works
  </text>


  <!-- FOOTER -->

  <text x="380" y="430"
        text-anchor="middle"
        fill="#484f58"
        font-family="Arial, sans-serif"
        font-size="10">
    Research → Define → Design → Test → Improve
  </text>

</svg>


