<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="510"
     viewBox="0 0 760 510">

  <!-- BACKGROUND -->
  <rect width="760" height="510" rx="24" fill="#0d1117"/>

  <rect x="1" y="1"
        width="758" height="508"
        rx="23"
        fill="none"
        stroke="#30363d"/>


  <!-- HEADER -->

  <text x="380" y="42"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold">
    Double Diamond
  </text>

  <text x="380" y="66"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="13">
    My approach to UX, digital design &amp; web development
  </text>


  <!-- TOP PROCESS LABELS -->

  <text x="190" y="104"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    EXPLORE
  </text>

  <text x="570" y="104"
        text-anchor="middle"
        fill="#f78166"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    CREATE
  </text>


  <!-- FIRST DIAMOND -->

  <polygon
    points="45,175 190,115 335,175 190,235"
    fill="#161b22"
    stroke="#58a6ff"
    stroke-width="2"/>

  <polygon
    points="45,175 190,115 190,235"
    fill="#58a6ff"
    opacity="0.12"/>

  <polygon
    points="190,115 335,175 190,235"
    fill="#a371f7"
    opacity="0.12"/>

  <line x1="190" y1="115"
        x2="190" y2="235"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- FIRST NUMBERS -->

  <text x="125" y="181"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    01
  </text>

  <text x="255" y="181"
        text-anchor="middle"
        fill="#a371f7"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    02
  </text>


  <!-- SECOND DIAMOND -->

  <polygon
    points="425,175 570,115 715,175 570,235"
    fill="#161b22"
    stroke="#f78166"
    stroke-width="2"/>

  <polygon
    points="425,175 570,115 570,235"
    fill="#f78166"
    opacity="0.12"/>

  <polygon
    points="570,115 715,175 570,235"
    fill="#3fb950"
    opacity="0.12"/>

  <line x1="570" y1="115"
        x2="570" y2="235"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- SECOND NUMBERS -->

  <text x="505" y="181"
        text-anchor="middle"
        fill="#f78166"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    03
  </text>

  <text x="635" y="181"
        text-anchor="middle"
        fill="#3fb950"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    04
  </text>


  <!-- ARROW -->

  <line x1="335" y1="175"
        x2="425" y2="175"
        stroke="#484f58"
        stroke-width="2"/>

  <polygon
    points="425,175 414,169 414,181"
    fill="#484f58"/>


  <!-- PHASE TITLES -->

  <text x="125" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Discover
  </text>

  <text x="255" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Define
  </text>

  <text x="505" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Develop
  </text>

  <text x="635" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Deliver
  </text>


  <!-- PHASE DESCRIPTIONS -->

  <text x="125" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Research the users
  </text>

  <text x="125" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Find needs &amp; insights
  </text>


  <text x="255" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Identify the problem
  </text>

  <text x="255" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Set goals &amp; direction
  </text>


  <text x="505" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Explore different ideas
  </text>

  <text x="505" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Prototype &amp; experiment
  </text>


  <text x="635" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Test the solution
  </text>

  <text x="635" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Launch &amp; improve
  </text>


  <!-- DIVIDER -->

  <line x1="70" y1="335"
        x2="690" y2="335"
        stroke="#21262d"
        stroke-width="1"/>


  <!-- PROJECT JOURNEY -->

  <text x="380" y="360"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    PROJECT JOURNEY
  </text>


  <!-- JOURNEY LINE -->

  <line x1="125" y1="400"
        x2="635" y2="400"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- PROJECT START -->

  <circle cx="125" cy="400"
          r="7"
          fill="#58a6ff"/>

  <text x="125" y="385"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    PROJECT START
  </text>

  <text x="125" y="425"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Brief · Research
  </text>


  <!-- VALUE PROPOSITION -->

  <circle cx="380" cy="400"
          r="8"
          fill="#a371f7"/>

  <text x="380" y="385"
        text-anchor="middle"
        fill="#a371f7"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    VALUE PROPOSITION
  </text>

  <text x="380" y="425"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Value · Users · Solution
  </text>


  <!-- FINISHED PROJECT -->

  <circle cx="635" cy="400"
          r="7"
          fill="#3fb950"/>

  <text x="635" y="385"
        text-anchor="middle"
        fill="#3fb950"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold">
    FINISHED PROJECT
  </text>

  <text x="635" y="425"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Launch · Feedback
  </text>


  <!-- BOTTOM -->

  <text x="380" y="458"
        text-anchor="middle"
        fill="#484f58"
        font-family="Arial, sans-serif"
        font-size="10">
    Understand → Define → Create → Deliver
  </text>

</svg>




