<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="470"
     viewBox="0 0 760 470">

  <!-- BACKGROUND -->
  <rect width="760" height="470" rx="24" fill="#0d1117"/>

  <rect x="1" y="1"
        width="758" height="468"
        rx="23"
        fill="none"
        stroke="#30363d"/>


  <!-- HEADER -->

  <text x="380" y="43"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold">
    Double Diamond
  </text>

  <text x="380" y="67"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="13">
    My approach to UX, digital design &amp; web development
  </text>


  <!-- PROCESS LABELS -->

  <text x="190" y="105"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    EXPLORE
  </text>

  <text x="570" y="105"
        text-anchor="middle"
        fill="#f78166"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    CREATE
  </text>


  <!-- FIRST DIAMOND -->

  <polygon
    points="45,175 190,115 335,175 190,235"
    fill="#161b22"
    stroke="#58a6ff"
    stroke-width="2"/>

  <polygon
    points="45,175 190,115 190,235"
    fill="#58a6ff"
    opacity="0.12"/>

  <polygon
    points="190,115 335,175 190,235"
    fill="#a371f7"
    opacity="0.12"/>

  <line x1="190" y1="115"
        x2="190" y2="235"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- DISCOVER NUMBER -->

  <text x="125" y="181"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    01
  </text>


  <!-- DEFINE NUMBER -->

  <text x="255" y="181"
        text-anchor="middle"
        fill="#a371f7"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    02
  </text>


  <!-- SECOND DIAMOND -->

  <polygon
    points="425,175 570,115 715,175 570,235"
    fill="#161b22"
    stroke="#f78166"
    stroke-width="2"/>

  <polygon
    points="425,175 570,115 570,235"
    fill="#f78166"
    opacity="0.12"/>

  <polygon
    points="570,115 715,175 570,235"
    fill="#3fb950"
    opacity="0.12"/>

  <line x1="570" y1="115"
        x2="570" y2="235"
        stroke="#30363d"
        stroke-width="2"/>


  <!-- DEVELOP NUMBER -->

  <text x="505" y="181"
        text-anchor="middle"
        fill="#f78166"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    03
  </text>


  <!-- DELIVER NUMBER -->

  <text x="635" y="181"
        text-anchor="middle"
        fill="#3fb950"
        font-family="Arial, sans-serif"
        font-size="13"
        font-weight="bold">
    04
  </text>


  <!-- ARROW -->

  <line x1="335" y1="175"
        x2="425" y2="175"
        stroke="#484f58"
        stroke-width="2"/>

  <polygon points="425,175 414,169 414,181"
           fill="#484f58"/>


  <!-- TITLES -->

  <text x="125" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Discover
  </text>

  <text x="255" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Define
  </text>

  <text x="505" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Develop
  </text>

  <text x="635" y="270"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Deliver
  </text>


  <!-- DESCRIPTIONS -->

  <!-- DISCOVER -->

  <text x="125" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Research the users
  </text>

  <text x="125" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Find needs &amp; insights
  </text>


  <!-- DEFINE -->

  <text x="255" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Identify the problem
  </text>

  <text x="255" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Set goals &amp; direction
  </text>


  <!-- DEVELOP -->

  <text x="505" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Explore different ideas
  </text>

  <text x="505" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Prototype &amp; experiment
  </text>


  <!-- DELIVER -->

  <text x="635" y="292"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Test the solution
  </text>

  <text x="635" y="308"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Launch &amp; improve
  </text>


  <!-- DIVIDER -->

  <line x1="80" y1="340"
        x2="680" y2="340"
        stroke="#21262d"
        stroke-width="1"/>


  <!-- DIVERGE -->

  <text x="190" y="369"
        text-anchor="middle"
        fill="#58a6ff"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    DIVERGE
  </text>

  <text x="190" y="388"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Open up possibilities
  </text>


  <!-- CONVERGE -->

  <text x="570" y="369"
        text-anchor="middle"
        fill="#3fb950"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        letter-spacing="1">
    CONVERGE
  </text>

  <text x="570" y="388"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="10">
    Focus on what works
  </text>


  <!-- BOTTOM STATEMENT -->

  <text x="380" y="425"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="11">
    Understand → Define → Explore → Test → Refine
  </text>

</svg>



