<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390">
  <rect width="700" height="390" rx="20" fill="#0d1117"/>

  <text x="35" y="45" fill="#58a6ff" font-size="23"
        font-family="Arial, sans-serif" font-weight="bold">
    My Tech Stack
  </text>

  <text x="35" y="70" fill="#8b949e" font-size="13"
        font-family="Arial, sans-serif">
    Technologies and tools I use
  </text>

  <!-- JavaScript -->
  <rect x="35" y="95" width="195" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="50" y="110" width="40" height="40" rx="6" fill="#F7DF1E"/>
  <text x="57" y="138" fill="#000" font-size="17"
        font-family="Arial, sans-serif" font-weight="bold">JS</text>
  <text x="105" y="137" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">JavaScript</text>

  <!-- Astro -->
  <rect x="250" y="95" width="195" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="265" y="110" width="40" height="40" rx="6" fill="#FF5D01"/>
  <text x="276" y="138" fill="#fff" font-size="18"
        font-family="Arial, sans-serif" font-weight="bold">A</text>
  <text x="320" y="137" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">Astro</text>

  <!-- HTML -->
  <rect x="465" y="95" width="200" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="480" y="110" width="40" height="40" rx="6" fill="#E34F26"/>
  <text x="487" y="138" fill="#fff" font-size="13"
        font-family="Arial, sans-serif" font-weight="bold">&lt;/&gt;</text>
  <text x="535" y="137" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">HTML</text>

  <!-- CSS -->
  <rect x="35" y="185" width="195" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="50" y="200" width="40" height="40" rx="6" fill="#1572B6"/>
  <text x="56" y="227" fill="#fff" font-size="13"
        font-family="Arial, sans-serif" font-weight="bold">CSS</text>
  <text x="105" y="227" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">CSS</text>

  <!-- GitHub -->
  <rect x="250" y="185" width="195" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <circle cx="285" cy="220" r="20" fill="#f0f6fc"/>
  <text x="273" y="227" fill="#0d1117" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">GH</text>
  <text x="320" y="227" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">GitHub</text>

  <!-- VS Code -->
  <rect x="465" y="185" width="200" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="480" y="200" width="40" height="40" rx="6" fill="#007ACC"/>
  <text x="487" y="227" fill="#fff" font-size="13"
        font-family="Arial, sans-serif" font-weight="bold">VS</text>
  <text x="535" y="227" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">VS Code</text>

  <!-- Figma -->
  <rect x="35" y="275" width="195" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>

  <circle cx="65" cy="300" r="10" fill="#F24E1E"/>
  <circle cx="85" cy="300" r="10" fill="#FF7262"/>
  <circle cx="65" cy="320" r="10" fill="#A259FF"/>
  <circle cx="85" cy="320" r="10" fill="#1ABCFE"/>
  <circle cx="85" cy="300" r="10" fill="#0ACF83"/>

  <text x="110" y="317" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">Figma</text>

  <!-- Illustrator -->
  <rect x="250" y="275" width="195" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="265" y="290" width="40" height="40" rx="6" fill="#330000"/>
  <text x="275" y="318" fill="#FF9A00" font-size="18"
        font-family="Arial, sans-serif" font-weight="bold">Ai</text>
  <text x="320" y="317" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">Illustrator</text>

  <!-- Photoshop -->
  <rect x="465" y="275" width="200" height="70" rx="12"
        fill="#161b22" stroke="#30363d"/>
  <rect x="480" y="290" width="40" height="40" rx="6" fill="#001E36"/>
  <text x="488" y="318" fill="#31A8FF" font-size="17"
        font-family="Arial, sans-serif" font-weight="bold">Ps</text>
  <text x="535" y="317" fill="#fff" font-size="14"
        font-family="Arial, sans-serif" font-weight="bold">Photoshop</text>

</svg>
